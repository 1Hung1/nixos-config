name: Update Flake Lock

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Nix and configures it securely on the Ubuntu runner
      - name: Install Nix
        uses: determinateSystems/nix-installer-action@v14

      # Optimizes builds by caching Nix store paths across runs
      - name: Magic Nix Cache
        uses: determinateSystems/magic-nix-cache-action@v8

      # Handles the lockfile update, commit creation, and PR submission
      - name: Update flake.lock
        uses: determinateSystems/update-flake-lock-action@v24
        with:
          pr-title: "chore(nix): update flake.lock"
          pr-labels: |
            dependencies
            nix
          body: |
            Automated update of all flake inputs.

            - Updated using `nix flake update`
            - Ran `nix flake check --no-build`
            - Evaluated both NixOS configurations.

            Please review the lockfile diff before merging.
