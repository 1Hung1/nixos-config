name: Update Flake Lock

on:
  schedule:
    # Runs everyday at 00:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Nix and configures it securely on the Ubuntu runner
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Optimizes builds by caching Nix store paths across runs
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Handles the lockfile update, commit creation, and PR submission
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "Update Nix flake inputs" # Title of PR to be created
          pr-labels: | # Labels to be set on the PR
            dependencies
            automated
            nix
