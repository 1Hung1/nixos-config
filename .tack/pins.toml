# shorturl schemes
[shorturls]
gh = "github:{path}"
nix-community = "gh:nix-community/{path}"
manic = "gh:manic-systems/{path}"
noctalia = "gh:noctalia-dev/{path}"

[all_follow]
home-manager = "home-manager"
nixpkgs = [ "nixpkgs-lib", "nixpkgs"]

[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-unstable"

[inputs.tack]
url = "manic:tack"

[inputs.home-manager]
url = "nix-community:home-manager"

[inputs.flake-parts]
url = "gh:hercules-ci/flake-parts"

[inputs.lanzaboote]
url = "nix-community:lanzaboote"

[inputs.noctalia]
url = "noctalia:noctalia/cachix"
exclude_follow = ["nixpkgs"]

[inputs.umbriel]
url = "noctalia:umbriel/cachix"
exclude_follow = ["nixpkgs"]

[inputs.qtengine]
url = "gh:kossLAN/qtengine"

[inputs.chaotic-nyx]
url = "gh:chaotic-cx/nyx/nyxpkgs-unstable"

[inputs.agenix]
url = "gh:ryantm/agenix"

[inputs.import-tree]
url = "gh:denful/import-tree"

[tack]
recomposable = true
type = "flake"
